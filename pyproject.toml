[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automeme-studio"
# 版本号唯一来源：core/__init__.py 的 __version__（避免多处手写导致漂移）
dynamic = ["version"]
description = "开黑语音接梗引擎 — 听懂对话，在合适的时机自动播放应景音效"
readme = "README.md"
requires-python = ">=3.8,<3.12"
license = { file = "LICENSE" }
keywords = ["gaming", "speech-recognition", "llm", "asr", "meme", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.10",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "PyQt5>=5.15.0",
    "sounddevice>=0.4.6",
    "PyAudioWPatch>=0.2.12",
    "pygame>=2.5.0",
    "sherpa-onnx>=1.13.0",
    "mss>=9.0.1",
    "opencv-python>=4.8.0",
    "rapidocr-onnxruntime>=1.3.16",
]

[project.optional-dependencies]
hotkey = ["keyboard>=0.13.5"]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["core"]

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
