name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        # 只装测试所需的轻量依赖。
        # 音频与视觉相关的重量级依赖（PyAudioWPatch / sherpa-onnx 等）
        # 仅 Windows 可用且体积大，单元测试通过 mock 覆盖，无需真实安装。
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests

      - name: 运行测试
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: 语法与格式检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 编译检查（捕获语法错误）
        run: |
          python -m compileall -q core tests main.py gui.py
          echo "所有文件语法检查通过"

      - name: 检查敏感信息泄露
        shell: bash
        run: |
          echo "扫描硬编码密钥与私有地址…"
          # 排除示例配置与文档
          if grep -rnE "sk-[a-zA-Z0-9]{20,}|192\.168\.[0-9]+\.[0-9]+" \
               --include="*.py" --include="*.json" . \
               | grep -v "config.example.json" \
               | grep -v "test_" ; then
            echo "::error::检测到疑似硬编码密钥或私有 IP，请检查"
            exit 1
          fi
          echo "未发现敏感信息"
